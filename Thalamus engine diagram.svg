<svg width="1040" height="440" viewBox="0 0 1040 440" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg{ fill:#FFFFFF; }
    .line{ stroke:#33404C; stroke-width:1.2; fill:none; opacity:0.5; stroke-dasharray:340; stroke-dashoffset:340; animation: draw 0.9s ease forwards; }
    @keyframes draw{ to{ stroke-dashoffset:0; } }
    .dot{ fill:#6E8899; opacity:0; animation: dotin 0.3s ease forwards; }
    @keyframes dotin{ to{ opacity:1; } }
    .fadein{ opacity:0; animation: fade 0.5s ease forwards; }
    @keyframes fade{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
    .card{ fill:#FFFFFF; stroke:#33404C; stroke-width:1; }
    .label{ font-family:Arial, Helvetica, sans-serif; font-size:15px; font-weight:500; fill:#12181F; }
    .core{ fill:#12181F; stroke:#33404C; stroke-width:1; }
    .core-title{ font-family:Arial, Helvetica, sans-serif; font-weight:700; font-size:17px; fill:#F4F5F1; letter-spacing:0.5px; }
    .core-sub{ font-family:"Courier New", monospace; font-size:10px; letter-spacing:1.2px; fill:#8FA0AC; }
    .step{ fill:#1B232C; stroke:#33404C; stroke-width:1; }
    .step-tag{ font-family:"Courier New", monospace; font-size:12px; fill:#7C8894; }
    .step-text{ font-family:Arial, Helvetica, sans-serif; font-size:15px; font-weight:500; fill:#C7CDD2; }
    .step-hi{
      fill:#2A1A1A; stroke:#9B3A3A; stroke-width:1.6;
      animation: pulse 2.4s ease-in-out 1.6s infinite;
      transform-origin: 520px 243px;
    }
    @keyframes pulse{
      0%, 100%{ stroke-width:1.6; stroke-opacity:1; }
      50%{ stroke-width:2.4; stroke-opacity:0.75; }
    }
    .step-tag-hi{ font-family:"Courier New", monospace; font-size:12px; fill:#9B3A3A; font-weight:600; }
    .step-text-hi{ font-family:Arial, Helvetica, sans-serif; font-size:15px; font-weight:600; fill:#F4F5F1; }
    .caption{ font-family:"Courier New", monospace; font-size:12px; fill:#6B7680; letter-spacing:0.5px; }
  </style>

  <rect class="bg" x="0" y="0" width="1040" height="440"/>

  <g>
    <path class="line" d="M190,56 C260,56 260,200 330,200" style="animation-delay:0.05s;"/>
    <path class="line" d="M190,200 L330,200" style="animation-delay:0.05s;"/>
    <path class="line" d="M190,344 C260,344 260,200 330,200" style="animation-delay:0.05s;"/>
    <path class="line" d="M330,200 L420,200" style="animation-delay:0.4s;"/>
    <path class="line" d="M620,200 L710,200" style="animation-delay:0.75s;"/>
    <path class="line" d="M710,200 C780,200 780,56 850,56" style="animation-delay:0.95s;"/>
    <path class="line" d="M710,200 L850,200" style="animation-delay:0.95s;"/>
    <path class="line" d="M710,200 C780,200 780,344 850,344" style="animation-delay:0.95s;"/>
  </g>
  <circle class="dot" cx="330" cy="200" r="4" style="animation-delay:0.35s;"/>
  <circle class="dot" cx="710" cy="200" r="4" style="animation-delay:0.7s;"/>

  <g class="fadein" style="animation-delay:0s;">
    <rect class="card" x="0" y="20" width="190" height="72" rx="4"/>
    <text class="label" x="24" y="62">Labs / notes /</text>
    <text class="label" x="24" y="80">other reports</text>

    <rect class="card" x="0" y="164" width="190" height="72" rx="4"/>
    <text class="label" x="24" y="206">Wearable data</text>

    <rect class="card" x="0" y="308" width="190" height="72" rx="4"/>
    <text class="label" x="24" y="350">Agent call transcripts</text>
  </g>

  <g class="fadein" style="animation-delay:0.35s;">
    <rect class="core" x="420" y="10" width="200" height="380" rx="6"/>
    <text class="core-title" x="520" y="52" text-anchor="middle">THALAMUS</text>
    <text class="core-sub" x="520" y="70" text-anchor="middle">DATA ENGINE</text>

    <rect class="step" x="440" y="100" width="160" height="46" rx="3"/>
    <text class="step-tag" x="456" y="128">L1</text>
    <text class="step-text" x="490" y="128">Ingest</text>

    <rect class="step" x="440" y="160" width="160" height="46" rx="3"/>
    <text class="step-tag" x="456" y="188">L2</text>
    <text class="step-text" x="490" y="188">Structure</text>

    <rect class="step-hi" x="440" y="220" width="160" height="46" rx="3"/>
    <text class="step-tag-hi" x="456" y="248">L3</text>
    <text class="step-text-hi" x="490" y="248">Propagate</text>

    <rect class="step" x="440" y="280" width="160" height="46" rx="3"/>
    <text class="step-tag" x="456" y="308">L4</text>
    <text class="step-text" x="490" y="308">Serve</text>
  </g>

  <g class="fadein" style="animation-delay:1s;">
    <rect class="card" x="850" y="20" width="190" height="72" rx="4"/>
    <text class="label" x="874" y="62">Clinical context</text>

    <rect class="card" x="850" y="164" width="190" height="72" rx="4"/>
    <text class="label" x="874" y="206">Guideline</text>
    <text class="label" x="874" y="224">recommender</text>

    <rect class="card" x="850" y="308" width="190" height="72" rx="4"/>
    <text class="label" x="874" y="350">Care gaps &amp; risks</text>
  </g>

  <g class="caption">
    <text x="0" y="425">RAW PATIENT DATA</text>
    <text x="932" y="425" text-anchor="end">COMPUTED PATIENT STATE</text>
  </g>
</svg>
